name: Pedir una canción de YouTube
description: Pide una canción por nombre y artista. La automatización buscará el video en YouTube.
title: 'Petición musical: '
body:
  - type: input
    id: cancion
    attributes:
      label: Canción
      placeholder: Nombre de la canción
    validations:
      required: true
  - type: input
    id: artista
    attributes:
      label: Artista
      placeholder: Nombre del artista
    validations:
      required: true
