name: Publicar Johan Music
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar servicio de peticiones
        run: node --test tests/service.test.mjs
      - uses: actions/configure-pages@v5
      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html styles.css app.js site-config.json _site/
          cp -R Imagenes Musica _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
